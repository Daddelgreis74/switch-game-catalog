<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121620"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#00c3e3" flood-opacity="0.35"/>
    </filter>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#ff3c5f" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base Icon Plate -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="6"/>

  <!-- LEFT JOYCON (Neon Blue) -->
  <g filter="url(#glow-blue)">
    <path d="M 140 96 C 85 96 68 140 68 190 L 68 322 C 68 372 85 416 140 416 L 232 416 C 240 416 244 412 244 404 L 244 108 C 244 100 240 96 232 96 Z" fill="#00c3e3"/>
    
    <!-- Minus Button -->
    <line x1="208" y1="136" x2="230" y2="136" stroke="#0a0c10" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Left Thumbstick -->
    <circle cx="156" cy="206" r="36" fill="#0a0c10"/>
    <circle cx="156" cy="206" r="26" fill="#1e2533" stroke="#0a0c10" stroke-width="4"/>
    <circle cx="156" cy="206" r="10" fill="#121620"/>
    
    <!-- Left D-Pad Buttons -->
    <circle cx="156" cy="296" r="12" fill="#0a0c10"/>
    <circle cx="156" cy="356" r="12" fill="#0a0c10"/>
    <circle cx="126" cy="326" r="12" fill="#0a0c10"/>
    <circle cx="186" cy="326" r="12" fill="#0a0c10"/>
  </g>

  <!-- RIGHT JOYCON (Neon Red) -->
  <g filter="url(#glow-red)">
    <path d="M 268 108 C 268 100 272 96 280 96 L 372 96 C 427 96 444 140 444 190 L 444 322 C 444 372 427 416 372 416 L 280 416 C 272 416 268 412 268 404 Z" fill="#ff3c5f"/>
    
    <!-- Plus Button -->
    <line x1="270" y1="136" x2="292" y2="136" stroke="#0a0c10" stroke-width="8" stroke-linecap="round"/>
    <line x1="281" y1="125" x2="281" y2="147" stroke="#0a0c10" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Right Action Buttons (ABXY) -->
    <circle cx="356" cy="180" r="12" fill="#0a0c10"/>
    <circle cx="356" cy="240" r="12" fill="#0a0c10"/>
    <circle cx="326" cy="210" r="12" fill="#0a0c10"/>
    <circle cx="386" cy="210" r="12" fill="#0a0c10"/>
    
    <!-- Right Thumbstick -->
    <circle cx="356" cy="318" r="36" fill="#0a0c10"/>
    <circle cx="356" cy="318" r="26" fill="#1e2533" stroke="#0a0c10" stroke-width="4"/>
    <circle cx="356" cy="318" r="10" fill="#121620"/>
  </g>
</svg>
